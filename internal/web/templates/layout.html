<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>{{if .Title}}{{.Title}} · {{end}}PIU Tracker{{if .Player}} · {{.Player}}{{end}}</title>
<link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml">
<link rel="preload" href="{{asset "fonts/exo-2-latin-wght-normal.woff2"}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "theme.js"}}"></script>
<script src="{{asset "app.js"}}" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{url "/"}}" aria-label="PIU Tracker home">{{padEmblem "brand-mark"}}<span class="brand-word"><b>PIU</b><span>Tracker</span></span></a>
    <nav class="nav" aria-label="Main">
      <a href="{{url "/"}}"{{if eq .Nav "songs"}} aria-current="page"{{end}}>Songs</a>
      <a href="{{url "/activity"}}"{{if eq .Nav "activity"}} aria-current="page"{{end}}>Activity</a>
    </nav>
    <div class="topbar-end">
      {{if .Player}}<span class="player-chip" title="Player">{{.Player}}</span>{{end}}
      <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="wrap">
{{template "content" .}}
</main>
<footer class="footer wrap">
  <span>PIU Tracker {{.AppVersion}}</span>
  <span>Jacket art © Andamiro, found via <a href="https://piuscores.arroweclip.se" rel="noopener">PIU Scores</a> and the <a href="https://pumpitup.fandom.com" rel="noopener">PIU Fandom wiki</a></span>
</footer>
<div class="tooltip" role="tooltip" hidden></div>
</body>
</html>
